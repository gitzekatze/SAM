# Weekly update proposals for the GitHub Actions and the Rust crates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all patch and minor updates.
      crates:
        update-types: [minor, patch]
