name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems** (an app gets out of its sandbox or reaches more than its settings allow): please do not report them here. Use *Security → Report a vulnerability* instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Add Krita-6.0.4-x86_64.AppImage\n2. Create sandbox\n3. Launch …"
  - type: input
    id: app
    attributes:
      label: Which AppImage (name, version, where from)?
  - type: textarea
    id: report
    attributes:
      label: Bug report from SAM
      description: In the window, Diagnostics → Copy a redacted bug report (or `sam-jail report APP`). Personal paths are removed; check before pasting.
      render: text
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: CachyOS, KDE Plasma 6.5, Wayland
    validations:
      required: true
