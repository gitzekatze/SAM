# Build, lint and test every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # To read the record of the last green run (what changed outside SAM).
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does the change touch anything but documents and the website? Text
  # cannot break SAM's code, so for a change that only touches documents
  # the build, test, window and sandbox steps are skipped; the website, the
  # test library and the function map are still checked. GitHub counts a
  # skipped job as passed, so such a pull request can be merged in about a
  # minute. Three documents are part of the code: docs/guide.md is built into
  # the window, and tests read docs/architecture.md and docs/syscalls-reviewed.txt.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs='^(docs/|[^/]+\.md$|scripts/site\.py$|\.github/ISSUE_TEMPLATE/)'
          code_docs='^docs/((guide|architecture)\.md|syscalls-reviewed\.txt)$'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true    # run by hand, or no earlier commit to compare with
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -Ev "$docs" | grep -q . \
            || git diff --name-only "$BASE" "$GITHUB_SHA" | grep -Eq "$code_docs"; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = true ] && echo "Code changed: every job runs." || echo "Only documents changed: the code jobs are skipped."

  # Dependencies: security advisories, licences, banned crates, sources
  # (deny.toml).
  deny:
    needs: changes
    # Runs unless the change is known to touch documents only (fail-safe).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  test:
    needs: changes
    if: ${{ !cancelled() }}
    # x86_64, and aarch64 (GitHub's free arm64 runners are for public
    # repositories, so that one starts once SAM is public).
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Not skipped as a whole: a skipped matrix job reports one check named
    # "test" instead of the two required ones. The code steps are skipped
    # one by one instead (env.CODE).
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the summary compares with the commit before the push.
          fetch-depth: 0

      # A stuck package server fails within apt's own limits (30 s per
      # connection, 3 tries; see scripts/ci-packages.sh). The step limit
      # only ends a download that keeps crawling: 10 minutes were too short
      # for a mirror at 150 KB/s (2026-11-19).
      - name: System packages
        if: env.CODE == 'true'
        timeout-minutes: 20
        run: |
          # Mirror choice and time limits: see the script.
          scripts/ci-packages.sh \
            libgtk-4-dev libadwaita-1-dev pkg-config \
            bubblewrap xdg-dbus-proxy passt libarchive-tools squashfs-tools python3 \
            desktop-file-utils appstream gettext libgtk-4-bin dbus \
            python3-gi libglib2.0-bin \
            pipewire pipewire-pulse pulseaudio-utils

      # Ubuntu restricts unprivileged user namespaces through AppArmor, so
      # Bubblewrap cannot run and the end-to-end sandbox tests would skip.
      # Lift it on this throwaway machine only.
      - name: Allow user namespaces for Bubblewrap
        if: env.CODE == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Rust (stable, SAM needs 1.92+)
        if: env.CODE == 'true'
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          rustup default stable
          rustc --version

      - uses: actions/cache@v6
        if: env.CODE == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        if: env.CODE == 'true'
        run: cargo build --workspace --locked

      # The outside world of this run: every contract's state and every
      # component's version (docs/contracts.md). Kept for the next runs, so
      # a failure can say what changed since the last green one.
      - name: Record the outside world
        if: env.CODE == 'true'
        run: target/debug/sam-jail --json doctor --contracts | tail -n 1 > "$RUNNER_TEMP/contracts.json"

      - uses: actions/upload-artifact@v7
        if: always() && env.CODE == 'true'
        with:
          name: contracts-${{ runner.arch }}
          path: ${{ runner.temp }}/contracts.json
          if-no-files-found: ignore

      - name: Format (rustfmt.toml)
        if: env.CODE == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: env.CODE == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The whole suite twice: a test whose result differs between the two
      # runs is flaky (its answer depends on timing, not only on the code)
      # and fails the job, like a test that fails.
      # SAM_TEST_GPG: also sign and check a test AppImage with GnuPG.
      - name: Tests (twice, to catch flaky ones)
        if: env.CODE == 'true'
        # SAM_REQUIRE_SANDBOX: a sandbox test that cannot run here fails
        # instead of skipping, so a green run always tested the sandbox.
        run: SAM_REQUIRE_SANDBOX=1 SAM_TEST_GPG=1 PATH="$PWD/target/debug:$PATH" python3 scripts/flaky-check.py --runs 2

      # On the run page: which of SAM's functions the change touches, and
      # how their tests did (docs/functions.toml).
      - name: Summary of the change
        if: always() && env.CODE == 'true'
        run: python3 scripts/push-summary.py "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Desktop file and metainfo
        if: env.CODE == 'true'
        run: |
          desktop-file-validate data/io.github.gitzekatze.SAM.desktop
          appstreamcli validate --no-net data/io.github.gitzekatze.SAM.metainfo.xml

      # Opens every page of the window on GTK's Broadway backend (no
      # desktop needed) and fails on GTK criticals, warnings or panics.
      - name: Window smoke test
        if: env.CODE == 'true'
        # session.sh, like the other window tests: a bus without service
        # files (dbus-run-session's default one can start desktop services),
        # its own home and settings.
        run: tests/gui/session.sh "$RUNNER_TEMP/gui-session" tests/gui/smoke.sh "$RUNNER_TEMP/gui"

      - name: Window screenshots
        if: always() && env.CODE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: window-screenshots-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/gui/*.png
            ${{ runner.temp }}/gui/*.log
          if-no-files-found: ignore

      - name: The website builds, with no broken links
        run: |
          sudo apt-get update -q -o Acquire::Retries=3 && sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 python3-markdown
          python3 scripts/site.py "$RUNNER_TEMP/site"

      - name: Shell scripts parse
        run: for f in scripts/*.sh tests/real-apps/*.sh tests/gui/*.sh tests/upgrade/*.sh; do sh -n "$f" || exit 1; done

      - name: Test library is up to date
        run: python3 scripts/test-library.py --check

      - name: Numbers in the documents are up to date
        run: python3 scripts/facts.py --check

      - name: Function map is complete and up to date
        run: python3 scripts/function-map.py --check

      - name: Contract map covers every outside assumption
        run: python3 scripts/contract-map.py --check

      # AUTOMATION.md: no workflow hands an attacker the repository, and
      # every pull request shows its risk class.
      - name: Workflows are safe, and the automation rules work
        run: |
          python3 scripts/workflow-check.py
          python3 scripts/workflow-check.py --self-test
          python3 scripts/risk-class.py --self-test
          python3 scripts/contract-verifier.py --self-test
          python3 scripts/changelog-check.py --self-test
          python3 scripts/changes.py --self-test

      - name: Risk class of this change
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE"
          python3 scripts/risk-class.py "origin/$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          # A behaviour change without a changelog line is flagged, never failed.
          python3 scripts/changelog-check.py "origin/$BASE"


      - name: Third-party licenses are up to date
        if: env.CODE == 'true'
        run: python3 scripts/third-party-licenses.py --check

      - name: Translations are complete and compile
        if: env.CODE == 'true'
        run: |
          python3 scripts/i18n.py check
          make mo

      - name: Man pages are up to date
        if: env.CODE == 'true'
        run: |
          target/debug/sam-jail man "$RUNNER_TEMP/man"
          for f in "$RUNNER_TEMP"/man/*.1; do
            diff -I '^\.TH' "$f" "data/man/$(basename "$f")" || { echo "data/man is out of date: run 'make man' and commit"; exit 1; }
          done

      # When something failed: what changed outside SAM since the last green
      # run on main (versions, contract states), in the run's summary.
      - name: What changed outside SAM
        if: failure() && env.CODE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -z "$prev" ] || gh run download "$prev" --name "contracts-${{ runner.arch }}" --dir "$RUNNER_TEMP/previous" || true
          python3 scripts/contract-diff.py "$RUNNER_TEMP/previous/contracts.json" "$RUNNER_TEMP/contracts.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # The sandbox tests (breakout, evil AppImages, permission matrix, end to
  # end) on Fedora as well: another distribution, other versions of
  # Bubblewrap, the kernel interfaces and the D-Bus proxy.
  # The window as a person uses it, through the accessibility interface in
  # a hidden nested KWin: the main flow (Create Sandbox, Launch), the app
  # page, the Permission Manager, keyboard and screen-reader names, and the
  # window in German and English (tests/gui/*-atspi.sh).
  window-flows:
    needs: changes
    # Runs unless the change is known to touch documents only (fail-safe).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        timeout-minutes: 20
        run: |
          # Mirror choice and time limits: see the script.
          scripts/ci-packages.sh \
            libgtk-4-dev libadwaita-1-dev pkg-config \
            bubblewrap xdg-dbus-proxy passt squashfs-tools python3 gettext dbus \
            kwin-wayland at-spi2-core python3-gi gir1.2-atspi-2.0 locales adwaita-icon-theme \
            pipewire pipewire-pulse pulseaudio-utils libglib2.0-bin
          # Older Ubuntu packages put KWin's virtual backend in its own package.
          sudo apt-get install -y -q --no-install-recommends kwin-wayland-backend-virtual 2>/dev/null || true
          sudo locale-gen en_US.UTF-8

      - name: Allow user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and translations
        run: |
          cargo build --workspace --locked
          make mo

      - name: Window tests
        run: |
          rc=0
          for t in flow app-page permissions a11y; do
            echo "== $t"
            sh tests/gui/$t-atspi.sh "$RUNNER_TEMP/gui-$t" || rc=1
          done
          exit $rc

      # The sandbox tests inside this desktop session: a hidden KWin with
      # PipeWire and its PulseAudio server, in the session's own folders. The
      # matrix must find Wayland and sound here (SAM_REQUIRE_DESKTOP/SOUND),
      # so the display and sound checks that bare CI machines skip run on
      # every change.
      - name: Sandbox tests in a desktop session (Wayland, sound)
        run: SAM_SESSION=kwin SAM_TEST_AUDIO=1 sh tests/gui/desktop-sandbox.sh "$RUNNER_TEMP/gui-desktop"

      - name: Window test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: window-flows
          path: |
            ${{ runner.temp }}/gui-*/*.log
            ${{ runner.temp }}/gui-*/*.png
          if-no-files-found: ignore


  # The same window tests under GNOME: a headless Mutter, GNOME's
  # compositor, instead of KWin. Ubuntu and Fedora use GNOME by default.
  window-flows-gnome:
    needs: changes
    # Runs unless the change is known to touch documents only (fail-safe).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        timeout-minutes: 20
        run: |
          # Mirror choice and time limits: see the script.
          scripts/ci-packages.sh \
            libgtk-4-dev libadwaita-1-dev pkg-config \
            bubblewrap xdg-dbus-proxy passt squashfs-tools python3 gettext dbus \
            mutter gsettings-desktop-schemas at-spi2-core python3-gi gir1.2-atspi-2.0 locales adwaita-icon-theme
          sudo locale-gen en_US.UTF-8

      - name: Allow user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and translations
        run: |
          cargo build --workspace --locked
          make mo

      - name: Window tests
        run: |
          rc=0
          for t in flow app-page permissions a11y; do
            echo "== $t"
            SAM_SESSION=mutter sh tests/gui/$t-atspi.sh "$RUNNER_TEMP/gui-$t" || rc=1
          done
          exit $rc

      - name: Window test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: window-flows-gnome
          path: |
            ${{ runner.temp }}/gui-*/*.log
            ${{ runner.temp }}/gui-*/*.png
            ${{ runner.temp }}/gui-*/mutter.log
          if-no-files-found: ignore
  sandbox-fedora:
    needs: changes
    # Runs unless the change is known to touch documents only (fail-safe).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The runner's kernel is Ubuntu's, which restricts user namespaces
      # for ordinary users through AppArmor. Inside a container this
      # setting cannot be changed, and Bubblewrap then fails to set up its
      # network ("loopback: Failed RTM_NEWADDR"). So it is lifted here, on
      # the runner itself (a throwaway machine), before Fedora starts.
      - name: Allow user namespaces on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # SAM runs as an ordinary user; as root, pasta ("This computer only")
      # switches to "nobody" on purpose and cannot join the sandbox's
      # network. So the build and the tests run as the user "tester".
      # The check that Bubblewrap works comes first: without it every
      # sandbox test would skip and the job would pass without testing.
      - name: Sandbox tests on Fedora
        run: |
          docker run --rm --privileged -v "$PWD:/src" registry.fedoraproject.org/fedora:latest bash -euxc '
            dnf install -y --setopt=install_weak_deps=False \
              rust cargo gcc pkgconf-pkg-config \
              bubblewrap xdg-dbus-proxy passt bsdtar squashfs-tools \
              python3 python3-gobject glib2 dbus-daemon \
              util-linux shadow-utils
            useradd -m tester
            chown -R tester /src
            su tester -c "bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true"
            su tester -c "cd /src && cargo build --locked -p sam-jail-cli"
            su tester -c "cd /src && SAM_REQUIRE_SANDBOX=1 PATH=/src/target/debug:\$PATH cargo test --locked -p sam-runner --test breakout --test evil --test matrix --test sandbox --test overlay_fallback --test fuzz"
            # The command-line sandbox tests too: the launcher-kill test with
            # "This computer only" needs a pasta with --splice-only, which
            # the Ubuntu runner lacks (there it is listed as not here).
            su tester -c "cd /src && SAM_REQUIRE_SANDBOX=1 cargo test --locked -p sam-jail-cli --test teardown --test layers --test start_check"
          '
