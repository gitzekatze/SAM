# The owner's decision (AUTOMATION.md): a change that weakens a security
# promise, changes a protected test or adds a dependency waits here for the
# label owner-approved. Its own workflow, so setting the label reruns only
# this check (seconds), not the whole CI.
name: Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # An approval is for what the owner saw: a new push takes the label off
  # (audit P3), and the check below ignores it on that push. The same on
  # reopening: a push to a closed pull request sends no "synchronize", so
  # the label could otherwise outlive code the owner never saw
  # (verification audit 2026-11-19).
  forget-approval:
    if: (github.event.action == 'synchronize' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'owner-approved')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Take the approval off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --remove-label owner-approved

  owner-approval:
    name: Needs your approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: What in this change needs the owner
        env:
          BASE: ${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch -q origin "$BASE"
          # The checker and its settings as the base branch has them, never
          # the pull request's own copy: a change could otherwise rewrite
          # the check that judges it (audit P2). Changing them needs the
          # owner (keeper.toml verifier.gate).
          mkdir -p .gate/scripts
          git show "origin/$BASE:scripts/contract-verifier.py" > .gate/scripts/contract-verifier.py
          git show "origin/$BASE:keeper.toml" > .gate/keeper.toml
          # The label counts only when a label was just set or taken off,
          # i.e. by someone looking at this very version; never on a push
          # or a reopening (see forget-approval above).
          approved=
          case "$ACTION" in
            labeled|unlabeled)
              case ",$LABELS," in *,owner-approved,*) approved=--approved ;; esac ;;
          esac
          set +e
          python3 .gate/scripts/contract-verifier.py "origin/$BASE" --head HEAD $approved > verdict.md
          rc=$?
          set -e
          {
            if [ $rc -eq 1 ]; then
              echo "## This change needs your decision"
              echo
              echo "Read the list below. If it is what you want, open the pull request, click **Labels** in the right sidebar and choose **owner-approved**. Only this check runs again (a few seconds) and turns green. A later push takes the label off again."
              echo
            elif [ $rc -eq 0 ] && [ -n "$approved" ]; then
              echo "## Approved by you (label owner-approved)"
              echo
            elif [ $rc -eq 0 ]; then
              echo "## Nothing in this change needs your approval"
              echo
            fi
            cat verdict.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
