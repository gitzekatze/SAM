# The owner's decision (AUTOMATION.md): a change that weakens a security
# promise, changes a protected test or adds a dependency waits here for the
# label owner-approved. Its own workflow, so setting the label reruns only
# this check (seconds), not the whole CI.
name: Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-approval:
    name: Needs your approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What in this change needs the owner
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch -q origin "$BASE"
          approved=
          case ",$LABELS," in *,owner-approved,*) approved=--approved ;; esac
          set +e
          python3 scripts/contract-verifier.py "origin/$BASE" $approved > verdict.md
          rc=$?
          set -e
          {
            if [ $rc -eq 1 ]; then
              echo "## This change needs your decision"
              echo
              echo "Read the list below. If it is what you want, open the pull request, click **Labels** in the right sidebar and choose **owner-approved**. Only this check runs again (a few seconds) and turns green."
              echo
            elif [ $rc -eq 0 ] && [ -n "$approved" ]; then
              echo "## Approved by you (label owner-approved)"
              echo
            elif [ $rc -eq 0 ]; then
              echo "## Nothing in this change needs your approval"
              echo
            fi
            cat verdict.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
