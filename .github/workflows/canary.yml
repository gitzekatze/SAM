# Early warning: SAM's contracts with the outside world, checked every night
# on the distributions that come next. Changes reach them weeks or months
# before most users get them, so a contract that breaks here is a warning in
# time (docs/contracts.md). Never required for merging: it watches the
# future, not a change. Results become issues labelled "early-warning",
# updated instead of duplicated and closed when green again.
name: Early warning

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The distributions come from keeper.toml ([canary]).
  distributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: read
        run: |
          python3 -c 'import json, tomllib; d = tomllib.load(open("keeper.toml", "rb"))["canary"]["distributions"]; print("matrix=" + json.dumps({"include": [{"name": x["name"], "image": x["image"]} for x in d]}))' >> "$GITHUB_OUTPUT"

  check:
    needs: distributions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.distributions.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Bubblewrap inside the container needs user namespaces, which
      # Ubuntu's AppArmor restricts on the runner itself.
      # GitHub's machine runs Ubuntu, whose AppArmor rules for pasta also
      # apply inside the container (same kernel) and stop it from reading
      # /proc/sys/net (found on the first run). They belong to the runner,
      # not to the distribution under test, so they are lifted here.
      - name: Allow user namespaces and pasta on the runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          for p in /etc/apparmor.d/*passt* /etc/apparmor.d/*pasta*; do
            [ -f "$p" ] && sudo apparmor_parser -R "$p" || true
          done

      - name: Check the contracts on ${{ matrix.name }}
        # Values from the matrix reach the shell as variables, never as
        # text written into the command (audit P10).
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/out-$NAME"
          docker run --rm --privileged -v "$PWD:/src:ro" -v "$RUNNER_TEMP/out-$NAME:/out" \
            "$IMAGE" sh /src/tests/canary/in-container.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: canary-${{ matrix.name }}
          path: ${{ runner.temp }}/out-${{ matrix.name }}

  report:
    needs: check
    # The kill switch (AUTOMATION.md): `off` opens and closes no issues.
    if: always() && vars.SAM_AUTOMATION != 'off'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: canary-*
          path: results

      # The night before, for "what changed since".
      - name: The previous night's results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow canary.yml --status completed --limit 2 --json databaseId --jq '.[1].databaseId // empty')
          mkdir -p previous
          [ -z "$prev" ] || gh run download "$prev" --pattern 'canary-*' --dir previous || true

      - name: Issues for what broke, closed for what is green again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # download-artifact names the folders after the artifacts.
          for d in results/canary-* previous/canary-*; do
            [ -d "$d" ] && mv "$d" "$(dirname "$d")/out-${d##*/canary-}"
          done
          python3 scripts/canary-report.py results --previous previous
