# On a version tag (made by scripts/release.sh): build the release files and
# the AppImages (x86_64 and aarch64) from the tag, test the AppImages on
# fresh systems, and attach them to a *draft* release. The AppImages are
# signed afterwards on the maintainer's computer (scripts/sign-release.sh);
# publishing the draft stays a manual step. Started by hand (workflow_dispatch), it builds and
# tests without making a draft.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      matrix:
        include:
          # AppImage type 2 runtimes, pinned (github.com/AppImage/type2-runtime).
          - arch: x86_64
            runner: ubuntu-24.04
            runtime_sha256: 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
          - arch: aarch64
            runner: ubuntu-24.04-arm
            runtime_sha256: 9a72a744d221576c9347ec074243acc5c3c7568896b12714e0e82e9f0bf47900
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: System packages
        run: |
          # Ubuntu's own archive: GitHub's Azure mirror of it was unreachable
          # for hours on 2026-11-11.
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' -e 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config squashfs-tools xz-utils gettext

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The source and vendored-crate tarballs are the same on every
      # architecture; they come from the x86_64 job only.
      - name: Release files
        if: matrix.arch == 'x86_64'
        run: make dist

      - name: AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/runtime" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}"
          RUNTIME="$RUNNER_TEMP/runtime" RUNTIME_SHA256="${{ matrix.runtime_sha256 }}" make appimage
          cat dist/*.AppImage.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  # Test what we ship: the finished AppImage in fresh containers of the
  # supported distributions, plus a plain refusal on older ones. No draft
  # release is made unless every system passes.
  test-shipped:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            systems: >-
              docker.io/library/ubuntu:24.04=works
              docker.io/library/debian:13=works
              registry.fedoraproject.org/fedora:latest=works
              docker.io/library/archlinux:latest=works
              registry.opensuse.org/opensuse/tumbleweed:latest=works
              docker.io/library/debian:12=too-old
              docker.io/library/ubuntu:22.04=too-old
          - arch: aarch64
            runner: ubuntu-24.04-arm
            systems: >-
              docker.io/library/ubuntu:24.04=works
              docker.io/library/debian:13=works
              registry.fedoraproject.org/fedora:latest=works
              docker.io/library/debian:12=too-old
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      # The runner's kernel restricts user namespaces for ordinary users
      # through AppArmor, which the sandboxes inside the containers need.
      - name: Allow user namespaces on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test the AppImage on every system
        run: sh scripts/test-shipped.sh dist/SAM-*-${{ matrix.arch }}.AppImage ${{ matrix.systems }}

  draft:
    needs: [appimage, test-shipped]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # Build provenance needs a token from GitHub's identity service.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The software bill of materials (SBOM): every component built into
      # SAM, with its version and license, in the SPDX format that tools for
      # checking known vulnerabilities read. Made from Cargo.lock.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sam-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Build provenance: a signed statement from GitHub that these files
      # were built by this workflow from this tag. Anyone can check a file
      # with `gh attestation verify FILE --repo gitzekatze/SAM`. GitHub
      # offers it for public repositories only. The AppImages are left out:
      # scripts/sign-release.sh writes the release key's signature into them
      # afterwards, which changes the files; that signature vouches for them.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --tags --force
          notes="$(git tag -l --format='%(contents:body)' "$TAG")"
          ls -l dist
          gh release create "$TAG" --draft --title "SAM ${TAG#v}" --notes "$notes" dist/*
