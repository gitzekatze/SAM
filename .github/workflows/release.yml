# On a version tag (made by scripts/release.sh): build the release files and
# the AppImages (x86_64 and aarch64) from the tag, test the AppImages on
# fresh systems, and attach them to a *draft* release. The AppImages are
# signed afterwards on the maintainer's computer (scripts/sign-release.sh);
# publishing the draft stays a manual step. Started by hand (workflow_dispatch), it builds and
# tests without making a draft.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only unless a job says otherwise: building and testing run code from
# many crates' build scripts and from container images (audit P7).
permissions:
  contents: read

jobs:
  appimage:
    strategy:
      matrix:
        include:
          # AppImage type 2 runtimes, pinned (github.com/AppImage/type2-runtime).
          - arch: x86_64
            runner: ubuntu-24.04
            runtime_sha256: 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
          - arch: aarch64
            runner: ubuntu-24.04-arm
            runtime_sha256: 9a72a744d221576c9347ec074243acc5c3c7568896b12714e0e82e9f0bf47900
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Build provenance is made here, by the job that built the files: the
    # maintainer's signing script accepts only AppImages it vouches for
    # (audit P1).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: System packages
        run: |
          # Mirror choice and time limits: see the script.
          scripts/ci-packages.sh libgtk-4-dev libadwaita-1-dev pkg-config squashfs-tools xz-utils gettext

      # One fixed Rust for release builds, so the same tag gives the same
      # files (audit P16). Raise it on purpose (docs/releasing.md); CI
      # itself keeps the newest stable Rust to see new warnings early.
      - name: Rust
        env:
          RUST_VERSION: "1.100.0"
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # The source and vendored-crate tarballs are the same on every
      # architecture; they come from the x86_64 job only.
      - name: Release files
        if: matrix.arch == 'x86_64'
        run: make dist

      - name: AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/runtime" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}"
          RUNTIME="$RUNNER_TEMP/runtime" RUNTIME_SHA256="${{ matrix.runtime_sha256 }}" make appimage
          cat dist/*.AppImage.sha256

      # Build provenance: a signed statement from GitHub that these files
      # were built by this job from this tag. Anyone can check a file with
      # `gh attestation verify FILE --repo gitzekatze/SAM`; the signing
      # script checks every AppImage this way before the release key signs
      # it. GitHub offers it for public repositories only.
      - name: Build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/') && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  # Test what we ship: the finished AppImage in fresh containers of the
  # supported distributions, plus a plain refusal on older ones. No draft
  # release is made unless every system passes.
  test-shipped:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            systems: >-
              docker.io/library/ubuntu:24.04=works
              docker.io/library/debian:13=works
              registry.fedoraproject.org/fedora:latest=works
              docker.io/library/archlinux:latest=works
              registry.opensuse.org/opensuse/tumbleweed:latest=works
              docker.io/library/debian:12=too-old
              docker.io/library/ubuntu:22.04=too-old
          - arch: aarch64
            runner: ubuntu-24.04-arm
            systems: >-
              docker.io/library/ubuntu:24.04=works
              docker.io/library/debian:13=works
              registry.fedoraproject.org/fedora:latest=works
              docker.io/library/debian:12=too-old
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      # The runner's kernel restricts user namespaces for ordinary users
      # through AppArmor, which the sandboxes inside the containers need.
      - name: Allow user namespaces on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test the AppImage on every system
        run: sh scripts/test-shipped.sh dist/SAM-*-${{ matrix.arch }}.AppImage ${{ matrix.systems }}

  # The software bill of materials (SBOM): every component built into SAM,
  # with its version and license, in the SPDX format that tools for
  # checking known vulnerabilities read. Made from Cargo.lock by a
  # third-party action, so in a job of its own that can change nothing and
  # never sees the AppImages (audit P1).
  sbom:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sam-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sam-*.spdx.json

  # Build provenance for the SBOM, as for every other file of the draft: the
  # signing script lets the release key sign only files the release build of
  # this tag made. In a job of its own, without the third-party action that
  # wrote the file: that action never holds the right to vouch for files.
  sbom-provenance:
    needs: sbom
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: sbom
      # GitHub offers it for public repositories only (as in the build job).
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: sbom/*

  # The only job that may write: it makes the draft release from the files
  # the build jobs made and attested, and the SBOM.
  draft:
    needs: [appimage, test-shipped, sbom, sbom-provenance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --tags --force "https://github.com/${GITHUB_REPOSITORY}.git"
          notes="$(git tag -l --format='%(contents:body)' "$TAG")"
          ls -l dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "SAM ${TAG#v}" --notes "$notes" dist/*
