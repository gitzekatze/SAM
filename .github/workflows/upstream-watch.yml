# Weekly: the projects SAM builds on, watched for changes that could break
# a contract before they reach any distribution (scripts/upstream-watch.py).
# Opens an issue labelled "upstream-change" when release notes mention an
# option SAM uses or a removal.
name: Upstream watch

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    # The kill switch (AUTOMATION.md): `off` stops the watch.
    if: vars.SAM_AUTOMATION != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Newest versions and their release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream-watch.py
