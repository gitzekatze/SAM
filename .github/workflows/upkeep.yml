# Weekly upkeep: the two checks too slow for every change.
#   - Mutation testing of last week's Rust code (scripts/mutants.sh): every
#     change no test notices is named with its SAM function.
#   - A long fuzz run of the parsers of untrusted data, with a random seed
#     drawn when the run starts (named in its report, so a failure can be
#     repeated), so every week tries inputs nobody knew in advance.
#   - Whether the generated pages still match the code.
# Everything goes into one issue, "Weekly summary" (scripts/weekly-summary.py,
# the automation plan's section 8), updated every week instead of a new one;
# a comment notifies the owner only when something needs them. No AI is
# involved. Never required for merging.
name: Weekly upkeep

on:
  schedule:
    - cron: "23 1 * * 6"
  workflow_dispatch:
    inputs:
      since:
        description: "Test the code changed since this commit or date (default: 7 days ago)"
        required: false
      fuzz_rounds:
        description: "Fuzz rounds per parser"
        required: false
        default: "100000"
      fuzz_seed:
        description: "Fuzz seed, to repeat a run (default: a new random one)"
        required: false

permissions:
  contents: read

jobs:
  mutants:
    # The kill switch (AUTOMATION.md): `off` stops the weekly runs.
    if: vars.SAM_AUTOMATION != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - &packages
        name: System packages
        timeout-minutes: 20
        run: |
          # Mirror choice and time limits: see the script.
          # The whole suite's packages, the same list as CI's test job:
          # each run here runs the whole suite and may not skip a test.
          scripts/ci-packages.sh --suite
      - &userns
        name: Allow user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - &rust
        name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - &cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: upkeep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: upkeep-${{ runner.os }}-${{ runner.arch }}-
      - name: cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0
      - name: Mutation testing of last week's code
        env:
          SINCE: ${{ inputs.since }}
        run: |
          mkdir -p "$RUNNER_TEMP/results/mutants"
          # A commit, or else a date (git would read a commit as "now").
          base=$(git rev-parse --verify -q "${SINCE:-none}^{commit}" || true)
          [ -n "$base" ] || base=$(git rev-list -1 --before="${SINCE:-7 days ago}" HEAD)
          [ -n "$base" ] || base=$(git rev-list --max-parents=0 HEAD | tail -n1)
          echo "Code changed since $base"
          set +e
          JOBS=2 scripts/mutants.sh -o "$RUNNER_TEMP/mutants" --diff "$base" 2>&1 | tee "$RUNNER_TEMP/results/mutants/report.txt"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/results/mutants/exit"
          { echo '### Mutation testing'; echo '```'; tail -n 60 "$RUNNER_TEMP/results/mutants/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: upkeep-mutants
          path: |
            ${{ runner.temp }}/results/mutants
            ${{ runner.temp }}/mutants/mutants.out/*.txt
            ${{ runner.temp }}/mutants/mutants.out/outcomes.json
            ${{ runner.temp }}/mutants/baseline.log

  fuzz:
    if: vars.SAM_AUTOMATION != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *packages
      - *userns
      - *rust
      - *cache
      - name: Long fuzz run
        env:
          ROUNDS: ${{ inputs.fuzz_rounds || '100000' }}
          SEED: ${{ inputs.fuzz_seed }}
        run: |
          mkdir -p "$RUNNER_TEMP/results/fuzz"
          # Random, never in the repository: a change cannot be shaped to
          # pass the inputs it will meet (the week's number was known ahead).
          case "$SEED" in
            ''|*[!0-9]*) seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ') ;;
            *) seed=$SEED ;;
          esac
          echo "Seed $seed, $ROUNDS rounds per parser" | tee "$RUNNER_TEMP/results/fuzz/report.txt"
          set +e
          SAM_REQUIRE_SANDBOX=1 SAM_FUZZ_SEED=$seed SAM_FUZZ_ITERS=$ROUNDS \
            cargo test --locked -p sam-runner --test fuzz -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/results/fuzz/report.txt"
          rc=${PIPESTATUS[0]}
          # The targeted fuzzers (sections, zsync, desktop files, the
          # unguarded preview) and the terminal filter's model; a tenth of
          # the rounds, as zsync planning may take up to two seconds a round.
          SAM_REQUIRE_SANDBOX=1 SAM_FUZZ_SEED=$seed SAM_FUZZ_ITERS=$((ROUNDS / 10)) \
            cargo test --locked -p sam-runner --test fuzz_targets -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/results/fuzz/report.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || rc=1
          SAM_REQUIRE_SANDBOX=1 SAM_FUZZ_SEED=$seed SAM_FUZZ_ITERS=$ROUNDS \
            cargo test --locked -p sam-core --test terminal_fuzz -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/results/fuzz/report.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || rc=1
          echo "$rc" > "$RUNNER_TEMP/results/fuzz/exit"
          { echo '### Long fuzz run'; echo '```'; tail -n 30 "$RUNNER_TEMP/results/fuzz/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: upkeep-fuzz
          path: |
            ${{ runner.temp }}/results/fuzz
            target/tmp/fuzz-crashes

  report:
    needs: [mutants, fuzz]
    # The kill switch: `off` writes no summary.
    if: always() && vars.SAM_AUTOMATION != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A week of history, for the reverts of the week.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: upkeep-*
          path: artifacts
      - name: Generated pages against the code
        run: |
          mkdir -p results
          for g in test-library function-map contract-map facts; do python3 "scripts/$g.py" > /dev/null; done
          git status --porcelain -- docs README.md | awk '{print $2}' > results/drift.txt
          cat results/drift.txt
      - name: The weekly summary
        env:
          GH_TOKEN: ${{ github.token }}
          SAM_AUTOMATION: ${{ vars.SAM_AUTOMATION }}
        run: |
          for part in mutants fuzz; do
            src=$(find "artifacts/upkeep-$part" -type d -path "*results/$part" 2>/dev/null | head -n1)
            mkdir -p "results/$part"
            if [ -n "$src" ]; then cp -r "$src/." "results/$part/" || true; fi
          done
          python3 scripts/weekly-summary.py results
