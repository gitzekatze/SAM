# SAM's website (GitHub Pages), built from the repository by scripts/site.py
# on every change to main. Nothing on the site is edited by hand.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the job that publishes may publish (audit P10, zizmor).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the dashboard counts and lists commits
      - name: Build the site
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-markdown
          # The diagram library, served by the site itself (no outside requests for visitors).
          mkdir -p target/site/assets
          curl -fsSL -o target/site/assets/mermaid.min.js https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
          # The site shows the download steps and the release key: the
          # script it serves must be exactly the one checked (audit P8).
          echo "a43bc1afd446f9c4cc66ac5dd45d02e8d65e26fc5344ec0ef787f88d6ddb6f9e  target/site/assets/mermaid.min.js" | sha256sum -c -
          python3 scripts/site.py target/site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
