[workspace]
resolver = "2"
members = [
    "crates/sam-core",
    "crates/sam-storage",
    "crates/sam-detect",
    "crates/sam-intake",
    "crates/sam-profile",
    "crates/sam-sandbox",
    "crates/sam-runner",
    "crates/sam-jail-cli",
    "crates/sam-gtk",
    "crates/sam-test-guard",
]
# Everything but the test guard: a plain `cargo build --release` in this
# folder builds SAM's programs and libraries, not the guard, which stops
# every build without debug assertions (crates/sam-test-guard/src/lib.rs).
default-members = [
    "crates/sam-core",
    "crates/sam-storage",
    "crates/sam-detect",
    "crates/sam-intake",
    "crates/sam-profile",
    "crates/sam-sandbox",
    "crates/sam-runner",
    "crates/sam-jail-cli",
    "crates/sam-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gitzekatze/SAM"
rust-version = "1.92"

[workspace.dependencies]
sam-core = { path = "crates/sam-core" }
sam-storage = { path = "crates/sam-storage" }
sam-detect = { path = "crates/sam-detect" }
sam-intake = { path = "crates/sam-intake" }
sam-profile = { path = "crates/sam-profile" }
sam-sandbox = { path = "crates/sam-sandbox" }
sam-runner = { path = "crates/sam-runner" }
# Test-only: every crate lists it under [dev-dependencies], never elsewhere.
sam-test-guard = { path = "crates/sam-test-guard" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.11"
sha1 = "0.11"
md4 = "0.11"
libc = "0.2"
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
memchr = "2"
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd", "lz4"] }
landlock = "0.4"
seccompiler = "0.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tempfile = "3"

# Debug builds keep line numbers for backtraces but not full debug info:
# the build folder stays several times smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Libraries optimized also in development builds: checksums, unpacking and
# ELF parsing of large AppImages otherwise take many times longer.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# Arithmetic on numbers read from an AppImage stops with an error instead of
# wrapping around silently (audit P16), as in development builds.
overflow-checks = true

# Lints for every part of SAM (each crate has `[lints] workspace = true`).
[workspace.lints.clippy]
# Every `unsafe` block says why it is correct, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
# No `.unwrap()` outside tests: a failure becomes an error the caller handles,
# or an `.expect("…")` that states why it cannot happen (clippy.toml allows
# unwrap in tests).
unwrap_used = "deny"
# No deliberate crashes outside tests either: a failure is an error the
# caller handles (tests may panic; that is how they fail).
panic = "deny"
todo = "deny"
unimplemented = "deny"
# The ways SAM could reach the network or start a program (clippy.toml):
# allowed here, so tests may use them, and denied at the root of every
# program crate outside its tests (`#![cfg_attr(not(test), deny(...))]`),
# where each use carries a listed #[expect]
# (crates/sam-jail-cli/tests/network_use.rs).
disallowed_methods = "allow"
disallowed_types = "allow"
