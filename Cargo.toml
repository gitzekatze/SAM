[workspace]
resolver = "2"
members = [
    "crates/sam-core",
    "crates/sam-storage",
    "crates/sam-detect",
    "crates/sam-intake",
    "crates/sam-profile",
    "crates/sam-sandbox",
    "crates/sam-runner",
    "crates/sam-jail-cli",
    "crates/sam-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gitzekatze/SAM"
rust-version = "1.92"

[workspace.dependencies]
sam-core = { path = "crates/sam-core" }
sam-storage = { path = "crates/sam-storage" }
sam-detect = { path = "crates/sam-detect" }
sam-intake = { path = "crates/sam-intake" }
sam-profile = { path = "crates/sam-profile" }
sam-sandbox = { path = "crates/sam-sandbox" }
sam-runner = { path = "crates/sam-runner" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.11"
sha1 = "0.11"
md4 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd", "lz4"] }
landlock = "0.4"
seccompiler = "0.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tempfile = "3"

# Debug builds keep line numbers for backtraces but not full debug info:
# the build folder stays several times smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
