# SAM's contracts with the world outside it. Every assumption SAM makes about
# programs, the kernel, the file system, sockets, variables, desktop services
# and file formats is written down here once, with what SAM does when it
# breaks and how it is checked. scripts/contract-map.py checks this file (CI)
# and writes docs/contracts.md from it:
#   - every outside program, option, host path, variable, D-Bus name, syscall
#     and Wayland protocol the code uses is covered by a contract (`covers`,
#     patterns as "kind:value", * as wildcard) or listed under [[own]];
#   - every named function, test and component exists;
#   - every contract says what happens when it breaks (`on_break`):
#       refuse   SAM does not start the sandbox and says why
#       safer    SAM falls back to less access (for example no network)
#       warn     the start goes ahead with a visible warning
#       feature  one feature is unavailable; the sandbox is unaffected
#       none     nothing breaks: the assumption only ever narrows access
#
# `coverage` says whether the tests check the whole assumption (full) or
# only part of it (partial, with `gaps` saying what is not tested).
#
# `probe` names the quick check `sam-jail doctor --contracts` runs on any
# computer; `tests` names the tests that check the behavior itself.

