tests = ["plain_elf_is_not_appimage", "a_type_2_appimage_is_recognized", "an_appimage_with_a_dwarfs_image_is_recognized", "a_file_that_is_no_program_is_not_an_appimage", "appimages_run_only_on_a_matching_processor", "appimages_with_every_compression_unpack", "an_appimage_for_another_processor_gets_no_sandbox",
