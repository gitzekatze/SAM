# SAM's functions, each with the code that carries it and the tests that
# prove it. scripts/function-map.py checks this file (CI) and writes
# docs/functions.md from it:
#   - every function names at least one test, or says why it has none (gap);
#   - every test in the code belongs to at least one function;
#   - every named test, file and check exists.
#
# `promise` is written so that a test can check it; the website words it
# for people. `code` names the parts (crates) and files that carry the
# function; `checks` names scripted checks outside `cargo test` (window
# tests, real-app runs). A test may prove several functions.

[[area]]
id = "A"
name = "Bringing an AppImage in"
about = "SAM finds AppImages, recognizes every format, unpacks them without running them, within limits, and survives damaged or hostile files."

[[function]]
id = 1
area = "A"
promise = "SAM finds AppImages in the folders you choose and shows them, sandboxed or not, without running anything."
code = ["sam-intake/src/peek.rs", "sam-intake/src/menu.rs", "sam-intake/src/id.rs", "sam-runner/src/ops/overview.rs", "sam-gtk/src/window.rs"]
tests = ["peeks_name_and_icon_without_extracting", "the_appimage_behind_a_foreign_menu_entry_is_found", "app_ids_stay_unique_when_names_collide", "found_appimages_get_a_menu_entry_only_with_a_sandbox", "the_folder_watcher_ignores_hidden_files_and_unfinished_downloads", "a_reader_gone_wrong_comes_to_nothing", "the_overview_reads_names_inside_a_sandbox", "dropped_pipes_and_icon_bombs_never_reach_gtk"]

