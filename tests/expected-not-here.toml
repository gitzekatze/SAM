# Tests that may say "not here" on a CI machine, per job, and why.
#
# "Not here" means the test does not apply to that machine (another
# processor, a component too old for SAM to use) and passes without checking
# anything. CI writes every such test into its job summary and fails when
# one is not listed here: a proof that quietly stopped running would
# otherwise stay green (scripts/skips.py). A listed test that runs after all
# is only named in the summary, so it can be taken off this list.
#
# Changing this file needs the owner (keeper.toml, verifier.gate): adding a
# test here lets it stop proving anything on that machine.

# The test job on the Ubuntu 24.04 runners (whole suite, no desktop).
[test-X64]
the_apps_ports_are_offered_on_this_computer_only = "Ubuntu 24.04's pasta has no --splice-only, so SAM never starts \"This computer only\" there (proven in the Fedora job)"
with_this_computer_only_the_sandbox_dies_with_its_launcher = "the same: no --splice-only (proven in the Fedora job)"
the_sandbox_check_passes_and_catches_mismatches = "its part for \"This computer only\" needs --splice-only (proven in the Fedora job)"
sound_never_loads_code_into_the_sound_server = "Ubuntu 24.04 has PipeWire 1.0, which cannot refuse module loading (proven in the Fedora job)"
under_this_computer_only_a_room_reaches_no_more_than_its_app = "Ubuntu 24.04's pasta has no --splice-only, so SAM never starts \"This computer only\" there (proven in the Fedora job)"
glycin_loads_images_in_a_room_never_without_a_sandbox = "Ubuntu 24.04's GTK image loading (gdk-pixbuf 2.42) has no glycin, which builds the sandboxes Room service serves (proven in the Fedora job)"

[test-ARM64]
the_apps_ports_are_offered_on_this_computer_only = "Ubuntu 24.04's pasta has no --splice-only (proven in the Fedora job)"
with_this_computer_only_the_sandbox_dies_with_its_launcher = "the same: no --splice-only (proven in the Fedora job)"
the_sandbox_check_passes_and_catches_mismatches = "its part for \"This computer only\" needs --splice-only (proven in the Fedora job)"
sound_never_loads_code_into_the_sound_server = "Ubuntu 24.04 has PipeWire 1.0, which cannot refuse module loading (proven in the Fedora job)"
an_appimage_for_another_processor_gets_no_sandbox = "the test turns an x86-64 AppImage into an ARM one, so it needs an x86-64 machine (runs in test-X64)"
under_this_computer_only_a_room_reaches_no_more_than_its_app = "Ubuntu 24.04's pasta has no --splice-only, so SAM never starts \"This computer only\" there (proven in the Fedora job)"
glycin_loads_images_in_a_room_never_without_a_sandbox = "Ubuntu 24.04's GTK image loading (gdk-pixbuf 2.42) has no glycin, which builds the sandboxes Room service serves (proven in the Fedora job)"

# The sandbox tests inside the KWin desktop session (window-flows).
[desktop]
each_permission_grants_exactly_its_access_in_a_real_sandbox = "KWin 5.27 on Ubuntu 24.04 offers no Wayland security contexts, so there is none to check"
the_sandbox_check_passes_and_catches_mismatches = "its part for \"This computer only\" needs --splice-only (proven in the Fedora job)"

# The sandbox tests on Fedora: everything runs.
[fedora]
