[package]
name = "sam-intake"
description = "AppImage extraction, desktop metadata and launcher integration for SAM - Sandboxed AppImage Manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The test AppImages (testkit.rs) are in development builds; a release
# build has them only with this feature. Release builds and packages never
# turn it on (docs/testing.md).
[features]
dev-tools = []

[dependencies]
sam-core.workspace = true
sam-detect.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
backhand.workspace = true
libc.workspace = true

[dev-dependencies]
sam-test-guard.workspace = true
sam-sandbox.workspace = true
tempfile.workspace = true

[lints]
workspace = true
