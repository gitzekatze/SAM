[package]
name = "sam-gtk"
description = "SAM's GTK 4 / libadwaita GUI (sam-jail-gui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sam-jail-gui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde_json.workspace = true
sam-core.workspace = true
