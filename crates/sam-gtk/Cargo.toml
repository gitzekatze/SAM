[package]
name = "sam-gtk"
description = "GTK 4 / libadwaita window of SAM - Sandboxed AppImage Manager (sam-jail-gui)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sam-jail-gui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde_json.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
sam-core.workspace = true
libc.workspace = true
