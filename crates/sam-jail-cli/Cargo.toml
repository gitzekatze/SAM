[package]
name = "sam-jail-cli"
description = "Command line interface of SAM - Sandboxed AppImage Manager (sam-jail, sam-jail-run)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sam-jail"
path = "src/main.rs"

[[bin]]
name = "sam-jail-run"
path = "src/bin/sam-jail-run.rs"

# The test and release tools (`sam-jail dev make-fixture`, `bench`,
# `set-update-info`, `make-zsync`, `sign-appimage`) are in development
# builds; a release build has them only with this feature. Release builds
# and packages never turn it on (docs/testing.md).
[features]
dev-tools = ["sam-intake/dev-tools"]

[dependencies]
sam-core.workspace = true
sam-storage.workspace = true
sam-detect.workspace = true
sam-intake.workspace = true
sam-profile.workspace = true
sam-runner.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
libc.workspace = true
clap_mangen = "0.3"

[dev-dependencies]
sam-test-guard.workspace = true
tempfile.workspace = true

[lints]
workspace = true
