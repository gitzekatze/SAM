appseal-profile.workspace = true
appseal-runner.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
